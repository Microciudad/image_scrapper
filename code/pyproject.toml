[project]
name = "cover-fetcher"
version = "0.1.0"
description = "Fetch music record cover images from Google and process them via a configurable pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3",
    "typer>=0.15.2",
    "Pillow>=11.1.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "numpy>=1.26.0",
    "playwright>=1.40.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
cover-fetcher = "cover_fetcher.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cover_fetcher"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "fake-useragent>=2.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
